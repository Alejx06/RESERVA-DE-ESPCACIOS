services:
  - type: web
    name: sistema-reservas-espacios
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm run install:all
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMAIL_DOMAIN
        value: amigo.edu.co
      - key: MAIL_SIMULATE
        value: "false"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        sync: false
      - key: APP_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
